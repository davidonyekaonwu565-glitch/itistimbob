<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2ff00" />
      <stop offset="100%" stop-color="#88b500" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Main Volt Brand Badge (Matches .logo-badge from Header) -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#voltGrad)" filter="url(#badgeShadow)" />
  <rect x="3" y="3" width="58" height="58" rx="16" fill="none" stroke="#a6dc00" stroke-width="1.5" />

  <!-- "IT" Monogram in Bold Brand Typography -->
  <text x="32" y="44" 
        font-family="system-ui, -apple-system, 'Space Grotesk', 'Impact', 'Arial Black', sans-serif" 
        font-size="33" 
        font-weight="900" 
        letter-spacing="-0.5px"
        fill="#040405" 
        text-anchor="middle">IT</text>

  <!-- Live Red Indicator Dot (Top Right) -->
  <circle cx="51" cy="13" r="6.5" fill="#ff3838" stroke="#040405" stroke-width="2.2" />
  <circle cx="49" cy="11" r="1.5" fill="#ffffff" opacity="0.85" />
</svg>
